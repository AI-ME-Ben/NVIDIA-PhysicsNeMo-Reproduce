# Position-only one-shot DI-GNN (re-implementation of Gulakala & Stoffel, PAMM 2026,
# doi:10.1002/pamm.70233; rollout.DIGNNOneShot) on the OpenRadioss bumper beam.
# Training follows the paper: Adam, lr 1e-3 -> 1e-5 cosine, 500 epochs, gradient
# loss weight 0.1 switched on after the data-only phase (epoch 250).
# Usage: python train.py --config-name=bumper_dignn_oneshot

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs_dignn/

experiment_name: "Bumper-OpenRadioss-DIGNN"

defaults:
  - reader: vtp
  - datapipe: graph
  - model: dignn_one_shot
  - training: default
  - inference: default
  - _self_

training:
  raw_data_dir: ${hydra:runtime.cwd}/data_full/vtk/train
  raw_data_dir_validation: ${hydra:runtime.cwd}/data_full/vtk/val
  global_features_filepath: ${hydra:runtime.cwd}/dataset_generation/global_features.json
  num_time_steps: 51
  num_training_samples: 121
  num_validation_samples: 5
  epochs: 500
  validation_freq: 25
  save_checkpoint_freq: 50
  num_dataloader_workers: 0
  optimizer: adam
  start_lr: 0.001
  end_lr: 0.00001

inference:
  raw_data_dir_test: ${hydra:runtime.cwd}/data_full/vtk/test

datapipe:
  static_features: []
  dynamic_targets: []          # position only (same as the position-only GeoTransolver)
  global_features:
    - velocity_x
    - thickness_scale
    - rwall_origin_y
  sample_type: all_time_steps
