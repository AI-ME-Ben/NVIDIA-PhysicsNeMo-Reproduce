# DI-GNN one-shot, see rollout.DIGNNOneShot.
_target_: rollout.DIGNNOneShot
_convert_: all

num_time_steps: ${training.num_time_steps}
output_dim: 150             # (num_time_steps - 1) * 3 positions
hidden_dim: 128
n_layers: 8                 # 1 FEMAT + 7 GATv2 (paper Table 3)
heads: 8
global_scales: [5.0, 1.0, 120.0]   # velocity_x (mm/ms), thickness_scale, rwall_origin_y (mm) -> O(1)
coord_scale: 0.25           # LMGS second affine scale for x / L_ref
disp_scale: 0.02            # network output = u / L_ref / disp_scale
grad_loss_weight: 0.1       # lambda_1
physics_start_epoch: 250    # two-phase schedule: data loss only before this epoch
